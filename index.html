<!DOCTYPE html>
<html b:css='false' b:defaultmarkuptype='html' lang='id' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
  <meta charset='utf-8'/>
  <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' name='viewport'/>
  
  <title>ABR DISTRO STORE WEB APP </title>
  
  <meta content='website' property='og:type'/>
  <meta expr:content='data:blog.pageTitle' property='og:title'/>
  <meta expr:content='data:blog.canonicalUrl' property='og:url'/>
  <meta expr:content='data:blog.title' property='og:site_name'/>
  
  <link href='https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;display=swap' rel='stylesheet'/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: &#39;Orbitron&#39;, -apple-system, sans-serif;
    }
    
    /* Overlay Screen Loading Utama */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a0202 0%, #050505 80%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* Container Lingkaran Logo &amp; Ring */
    .skull-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ring Energi Merah Memutar */
    .energy-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top: 3px solid #ff003c;
      border-right: 3px solid #ff003c;
      border-radius: 50%;
      box-shadow: 0 0 25px #ff003c, inset 0 0 15px #ff003c;
      animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    .energy-ring-inner {
      position: absolute;
      width: 80%;
      height: 80%;
      border: 2px dashed #990000;
      border-radius: 50%;
      animation: spinReverse 2.5s linear infinite;
    }

    /* Styling Custom Logo Anda */
    .skull-logo-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px #ff003c) drop-shadow(0 0 25px #990000);
      animation: pulseLogo 1.2s ease-in-out infinite alternate;
      z-index: 2;
    }

    /* Teks Brand Gothic / Cyberpunk */
    .brand-title {
      font-family: &#39;Orbitron&#39;, sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin-top: 30px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c, 0 0 40px #ff003c;
      animation: glitchText 2s infinite;
      text-align: center;
      padding: 0 15px;
    }

    .loading-status {
      margin-top: 10px;
      font-size: 13px;
      color: #ff4d4d;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      animation: blink 1s infinite alternate;
    }

    /* Keyframes Animasi */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseLogo {
      0% { transform: scale(0.92); filter: drop-shadow(0 0 8px #ff003c); }
      100% { transform: scale(1.08); filter: drop-shadow(0 0 20px #ff003c) drop-shadow(0 0 35px #ff0000); }
    }
    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    @keyframes glitchText {
      0%, 100% { text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c; }
      50% { text-shadow: -2px 0 #00ffff, 2px 0 #ff003c, 0 0 25px #ff003c; }
    }

    /* Transisi Selesai Loading (Zoom Out + Fade Out) */
    #loader.fade-out {
      opacity: 0;
      transform: scale(1.15);
      pointer-events: none;
    }
    
    /* Container &amp; Iframe */
    .app-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    /* Fallback Link Button */
    #fallback-btn {
      display: none;
      margin-top: 25px;
      padding: 10px 22px;
      background: transparent;
      color: #ff003c;
      text-decoration: none;
      border: 2px solid #ff003c;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
      transition: all 0.3s ease;
    }
    #fallback-btn:hover {
      background: #ff003c;
      color: #ffffff;
      box-shadow: 0 0 25px #ff003c;
    }
  </style>

  <b:skin><![CDATA[]]></b:skin>
</head>
<body>

  <div id='loader'>
    <div class='skull-container'>
      <div class='energy-ring'/>
      <div class='energy-ring-inner'/>
      
      <img alt='ABR Distro Logo' class='skull-logo-img' src='https://files.catbox.moe/ayp7e3.png'/>
    </div>

    <div class='brand-title'>ABR DISTRO STORE</div>
    <div class='loading-status'>LOADING...</div>

    <a href='https://script.google.com/macros/s/AKfycbwU8uIgSC10jx2ySw0YZGoqxhzPfWgtbSivsemHM7HcHAaffEdMA8bFFUBgr0-bdcjThA/exec' id='fallback-btn' target='_blank'>MASUK LANGSUNG</a>
  </div>

  <div class='app-container'>
    <iframe id='gas-frame' onload='hideLoader()' src='https://script.google.com/macros/s/AKfycbwU8uIgSC10jx2ySw0YZGoqxhzPfWgtbSivsemHM7HcHAaffEdMA8bFFUBgr0-bdcjThA/exec'/>
  </div>

  <script type='text/javascript'>
    //<![CDATA[
    function hideLoader() {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          loader.style.display = 'none';
        }, 600);
      }
    }

    // Tampilkan tombol darurat jika loading > 7 detik
    setTimeout(function() {
      var btn = document.getElementById('fallback-btn');
      var loader = document.getElementById('loader');
      if (btn && loader && !loader.classList.contains('fade-out')) {
        btn.style.display = 'inline-block';
      }
    }, 7000);
    //]]>
  </script>

  <b:section id='main'>

        <b:widget-setting name='showDateHeader'>true</b:widget-setting>
        <b:widget-setting name='style.textcolor'>#ffffff</b:widget-setting>
        <b:widget-setting name='showShareButtons'>false</b:widget-setting>
        <b:widget-setting name='showCommentLink'>true</b:widget-setting>
        <b:widget-setting name='style.urlcolor'>#ffffff</b:widget-setting>
        <b:widget-setting name='showAuthor'>true</b:widget-setting>
        <b:widget-setting name='style.linkcolor'>#ffffff</b:widget-setting>
        <b:widget-setting name='style.unittype'>TextAndImage</b:widget-setting>
        <b:widget-setting name='style.bgcolor'>#ffffff</b:widget-setting>
        <b:widget-setting name='reactionsLabel'/>
        <b:widget-setting name='showAuthorProfile'>false</b:widget-setting>
        <b:widget-setting name='style.layout'>1x1</b:widget-setting>
        <b:widget-setting name='showLabels'>true</b:widget-setting>
        <b:widget-setting name='showLocation'>true</b:widget-setting>
        <b:widget-setting name='showTimestamp'>true</b:widget-setting>
        <b:widget-setting name='postsPerAd'>1</b:widget-setting>
        <b:widget-setting name='showBacklinks'>false</b:widget-setting>
        <b:widget-setting name='style.bordercolor'>#ffffff</b:widget-setting>
        <b:widget-setting name='showInlineAds'>false</b:widget-setting>
        <b:widget-setting name='showReactions'>false</b:widget-setting>
      </b:widget-settings>

  <b:if cond='!data:mobile'>
    <div class='blog-posts hfeed'>

      <b:include data='top' name='status-message'/>

      <b:loop values='data:posts' var='post'>
        <b:if cond='data:post.isDateStart and not data:post.isFirstPost'>
          &lt;/div&gt;&lt;/div&gt;
