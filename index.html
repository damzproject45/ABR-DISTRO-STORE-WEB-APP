<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  
  <title>ABR DISTRO STORE WEB APP</title>
  
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="ABR DISTRO STORE WEB APP"/>
  <meta property="og:site_name" content="ABR DISTRO STORE"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;display=swap" rel="stylesheet"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Orbitron', -apple-system, sans-serif;
    }
    
    /* Overlay Screen Loading Utama */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a0202 0%, #050505 80%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* Container Lingkaran Logo & Ring */
    .skull-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ring Energi Merah Memutar */
    .energy-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top: 3px solid #ff003c;
      border-right: 3px solid #ff003c;
      border-radius: 50%;
      box-shadow: 0 0 25px #ff003c, inset 0 0 15px #ff003c;
      animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    .energy-ring-inner {
      position: absolute;
      width: 80%;
      height: 80%;
      border: 2px dashed #990000;
      border-radius: 50%;
      animation: spinReverse 2.5s linear infinite;
    }

    /* Styling Custom Logo */
    .skull-logo-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px #ff003c) drop-shadow(0 0 25px #990000);
      animation: pulseLogo 1.2s ease-in-out infinite alternate;
      z-index: 2;
    }

    /* Teks Brand Cyberpunk */
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin-top: 30px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c, 0 0 40px #ff003c;
      animation: glitchText 2s infinite;
      text-align: center;
      padding: 0 15px;
    }

    .loading-status {
      margin-top: 10px;
      font-size: 13px;
      color: #ff4d4d;
      letter-spacing: 4px;
      font-weight: 700;
      text-transform: uppercase;
      animation: blink 1s infinite alternate;
    }

    /* Keyframes Animasi */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseLogo {
      0% { transform: scale(0.92); filter: drop-shadow(0 0 8px #ff003c); }
      100% { transform: scale(1.08); filter: drop-shadow(0 0 20px #ff003c) drop-shadow(0 0 35px #ff0000); }
    }
    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    @keyframes glitchText {
      0%, 100% { text-shadow: 0 0 10px #ff003c, 0 0 20px #ff003c; }
      50% { text-shadow: -2px 0 #00ffff, 2px 0 #ff003c, 0 0 25px #ff003c; }
    }

    /* Transisi Selesai Loading */
    #loader.fade-out {
      opacity: 0;
      transform: scale(1.15);
      pointer-events: none;
    }
    
    /* Container & Iframe */
    .app-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    /* Fallback Link Button */
    #fallback-btn {
      display: none;
      margin-top: 25px;
      padding: 10px 22px;
      background: transparent;
      color: #ff003c;
      text-decoration: none;
      border: 2px solid #ff003c;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
      transition: all 0.3s ease;
    }
    #fallback-btn:hover {
      background: #ff003c;
      color: #ffffff;
      box-shadow: 0 0 25px #ff003c;
    }
  </style>
</head>
<body>

  <!-- Screen Loading Animasi -->
  <div id="loader">
    <div class="skull-container">
      <div class="energy-ring"></div>
      <div class="energy-ring-inner"></div>
      
      <img alt="ABR Distro Logo" class="skull-logo-img" src="https://files.catbox.moe/ayp7e3.png"/>
    </div>

    <div class="brand-title">ABR DISTRO STORE</div>
    <div class="loading-status">LOADING...</div>

    <a href="https://script.google.com/macros/s/AKfycbwU8uIgSC10jx2ySw0YZGoqxhzPfWgtbSivsemHM7HcHAaffEdMA8bFFUBgr0-bdcjThA/exec" id="fallback-btn" target="_blank">MASUK LANGSUNG</a>
  </div>

  <!-- Main Web App Window -->
  <div class="app-container">
    <iframe id="gas-frame" onload="hideLoader()" src="https://script.google.com/macros/s/AKfycbwU8uIgSC10jx2ySw0YZGoqxhzPfWgtbSivsemHM7HcHAaffEdMA8bFFUBgr0-bdcjThA/exec"></iframe>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          loader.style.display = 'none';
        }, 600);
      }
    }

    // Tampilkan tombol darurat jika loading web app lebih dari 7 detik
    setTimeout(function() {
      var btn = document.getElementById('fallback-btn');
      var loader = document.getElementById('loader');
      if (btn && loader && !loader.classList.contains('fade-out')) {
        btn.style.display = 'inline-block';
      }
    }, 7000);
  </script>

</body>
</html>
